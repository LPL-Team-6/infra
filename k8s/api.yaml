apiVersion: apps/v1
kind: Deployment
metadata:
  name: caseauth-api
  namespace: caseauth
  labels:
    app.kubernetes.io/name: caseauth-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caseauth-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caseauth-api
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:17
          command: ["sh", "-c", "until pg_isready -h caseauth-db -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 2; done"]
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: caseauth-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: caseauth-secrets
                  key: POSTGRES_USER
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: api
          image: ghcr.io/lpl-team-6/caseauth-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: caseauth-api-config
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: caseauth-secrets
                  key: ConnectionStrings__Postgres
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: caseauth-secrets
                  key: AWS_REGION
                  optional: true
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: caseauth
spec:
  selector:
    app.kubernetes.io/name: caseauth-api
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
