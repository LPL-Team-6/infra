apiVersion: apps/v1
kind: Deployment
metadata:
  name: caseauth-frontend
  namespace: caseauth
  labels:
    app.kubernetes.io/name: caseauth-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caseauth-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caseauth-frontend
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/lpl-team-6/caseauth-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: caseauth-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      
---
apiVersion: v1
kind: Service
metadata:
  name: caseauth-frontend
  namespace: caseauth
spec:
  selector:
    app.kubernetes.io/name: caseauth-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
