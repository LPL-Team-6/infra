apiVersion: v1
kind: Service
metadata:
  name: caseauth-db
  namespace: caseauth
spec:
  selector:
    app.kubernetes.io/name: caseauth-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caseauth-db
  namespace: caseauth
  labels:
    app.kubernetes.io/name: caseauth-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: caseauth-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caseauth-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: caseauth-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: caseauth-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: caseauth-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 10
          startupProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: caseauth-db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caseauth-db
  namespace: caseauth
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
